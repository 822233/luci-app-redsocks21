name: 编译 Redsocks2（ImmortalWrt 24.10 / MT7981）

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: ImmortalWrt 24.10 mediatek/filogic SDK 下载地址
        required: true
        default: https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  push:
    branches:
      - immortalwrt-24.10-https

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget zstd

      - name: 下载并解压 ImmortalWrt SDK
        env:
          SDK_URL: ${{ github.event.inputs.sdk_url || 'https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
        run: |
          wget -q "$SDK_URL" -O /tmp/immortalwrt-sdk.tar.zst
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf /tmp/immortalwrt-sdk.tar.zst -C "$RUNNER_TEMP/sdk" --strip-components=1

      - name: 准备软件包编译环境
        working-directory: ${{ runner.temp }}/sdk
        run: |
          set -euxo pipefail
          mkdir -p package/libs/openssl package/libs/libevent2
          cp -a "$GITHUB_WORKSPACE/sdk/openssl/." package/libs/openssl/
          cp "$GITHUB_WORKSPACE/sdk/openssl-module.mk" include/openssl-module.mk
          cp "$GITHUB_WORKSPACE/sdk/libevent2/Makefile" package/libs/libevent2/Makefile

          ./scripts/feeds update -a
          ./scripts/feeds install -p packages curl
          ./scripts/feeds install -p luci luci-base

          mkdir -p feeds/base/libs
          rm -rf feeds/base/libs/openssl
          ln -s "$PWD/package/libs/openssl" feeds/base/libs/openssl
          test -f package/libs/openssl/Config.in
          test -f feeds/base/libs/openssl/Config.in
          echo "OpenSSL Config.in: $(readlink -f feeds/base/libs/openssl/Config.in)"

          mkdir -p package/redsocks2
          cp -a "$GITHUB_WORKSPACE/redsocks2/." package/redsocks2/

          # Remove any SDK/feed copy of this app. The local maintained source
          # must be the only package definition selected by the build system.
          rm -rf feeds/base/luci-app-redsocks2 feeds/luci/luci-app-redsocks2
          rm -rf package/luci-app-redsocks2
          mkdir -p package/luci-app-redsocks2
          cp "$GITHUB_WORKSPACE/Makefile" package/luci-app-redsocks2/
          cp -a "$GITHUB_WORKSPACE/luasrc" package/luci-app-redsocks2/
          cp -a "$GITHUB_WORKSPACE/root" package/luci-app-redsocks2/
          if [ -d "$GITHUB_WORKSPACE/htdocs" ]; then
            cp -a "$GITHUB_WORKSPACE/htdocs" package/luci-app-redsocks2/
          fi
          if [ -d "$GITHUB_WORKSPACE/po" ]; then
            cp -a "$GITHUB_WORKSPACE/po" package/luci-app-redsocks2/
          fi
          test -f package/luci-app-redsocks2/Makefile
          grep -Fx 'PKG_RELEASE:=15' package/luci-app-redsocks2/Makefile
          test -f package/luci-app-redsocks2/luasrc/controller/redsocks2.lua
          test -f package/luci-app-redsocks2/htdocs/luci-static/resources/view/redsocks2/general-r15.js
          test -f package/luci-app-redsocks2/htdocs/luci-static/resources/view/redsocks2/import.js
          test -f feeds/luci/luci.mk
          make defconfig
          printf '\nCONFIG_PACKAGE_libopenssl=y\n# CONFIG_OPENSSL_ENGINE is not set\n# CONFIG_OPENSSL_ENGINE_BUILTIN is not set\n# CONFIG_OPENSSL_ENGINE_BUILTIN_DEVCRYPTO is not set\nCONFIG_PACKAGE_libopenssl-conf=y\nCONFIG_PACKAGE_libevent2=y\nCONFIG_PACKAGE_libevent2-openssl=y\nCONFIG_PACKAGE_redsocks2=m\nCONFIG_PACKAGE_luci-app-redsocks2=m\n' >> .config
          make defconfig
          grep -E '^(CONFIG_PACKAGE_(libopenssl|libopenssl-conf|libevent2|libevent2-openssl|redsocks2|luci-app-redsocks2)=)' .config

      - name: Shell 脚本语法检查
        run: |
          sh -n "$GITHUB_WORKSPACE/root/etc/init.d/redsocks2"
          sh -n "$GITHUB_WORKSPACE/root/usr/bin/redsocks2-speedtest"
          sh -n "$GITHUB_WORKSPACE/root/usr/bin/redsocks2-subscription"
          sh -n "$GITHUB_WORKSPACE/root/usr/bin/redsocks2-update-chnroute"

      - name: LuCI JavaScript 语法检查
        run: |
          node --check "$GITHUB_WORKSPACE/htdocs/luci-static/resources/view/redsocks2/general.js"
          node --check "$GITHUB_WORKSPACE/htdocs/luci-static/resources/view/redsocks2/general-r15.js"
          node --check "$GITHUB_WORKSPACE/htdocs/luci-static/resources/view/redsocks2/import.js"
          python3 -m json.tool "$GITHUB_WORKSPACE/root/usr/share/rpcd/acl.d/luci-app-redsocks2.json" >/dev/null

      - name: 编译软件包
        working-directory: ${{ runner.temp }}/sdk
        run: |
          make package/libs/openssl/compile -j2 V=s
          make package/libs/libevent2/compile -j2 V=s
          make package/redsocks2/compile -j2 V=s
          make package/luci-app-redsocks2/compile -j2 V=s

      - name: 收集 IPK 安装包
        working-directory: ${{ runner.temp }}/sdk
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f \( -name 'redsocks2_*.ipk' -o -name 'luci-app-redsocks2_*.ipk' \) -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;

          mapfile -t ipks < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.ipk' | sort)
          test "${#ipks[@]}" -eq 2
          for expected in redsocks2 luci-app-redsocks2; do
            matches=("$GITHUB_WORKSPACE"/dist/"$expected"_*.ipk)
            test "${#matches[@]}" -eq 1
            ipk="${matches[0]}"
            members="$(tar -tzf "$ipk")"
            control_member="$(printf '%s\n' "$members" | grep -m1 -E '(^|/)control.tar.gz$')"
            test -n "$control_member"
            control="$(tar -xzOf "$ipk" "$control_member" | tar -xzOf - ./control)"
            printf '%s\n' "$control" | grep -Fx "Package: $expected"
            printf '%s\n' "$control" | grep -Eq '^Version: [^[:space:]]+'
            printf '%s\n' "$control" | grep -Eq '^Architecture: [^[:space:]]+'
            if [ "$expected" = "luci-app-redsocks2" ]; then
              printf '%s\n' "$control" | grep -Fx 'Version: 1.0.3-r15'
              data_member="$(printf '%s\n' "$members" | grep -m1 -E '(^|/)data.tar.gz$')"
              test -n "$data_member"
              data_members="$(tar -xzOf "$ipk" "$data_member" | tar -tzf -)"
              printf '%s\n' "$data_members" | grep -Eq '(^|/)usr/lib/lua/luci/controller/redsocks2\.lua$'
              printf '%s\n' "$data_members" | grep -Eq '(^|/)usr/share/rpcd/acl\.d/luci-app-redsocks2\.json$'
              printf '%s\n' "$data_members" | grep -Eq '(^|/)www/luci-static/resources/view/redsocks2/general-r15\.js$'
              printf '%s\n' "$data_members" | grep -Eq '(^|/)www/luci-static/resources/view/redsocks2/import\.js$'
              printf '%s\n' "$data_members" | grep -Eq '(^|/)usr/bin/redsocks2-subscription$'
              controller="$(tar -xzOf "$ipk" "$data_member" | tar -xzOf - ./usr/lib/lua/luci/controller/redsocks2.lua)"
              printf '%s\n' "$controller" | grep -F 'local general = entry'
              if printf '%s\n' "$controller" | grep -Fq 'entry({"admin", "services", "redsocks2", "general"}).acl_depends'; then
                echo "ERROR: stale duplicate LuCI route registration packaged" >&2
                exit 1
              fi
            fi
            echo "Verified $ipk"
            printf '%s\n' "$control"
          done
          sha256sum "${ipks[@]}"

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: redsocks2-immortalwrt-mediatek-filogic
          path: dist/*.ipk
          if-no-files-found: error
